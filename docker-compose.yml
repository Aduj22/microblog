services:
  prod:
    build:
      context: .
      dockerfile: docker/Dockerfile_prod
      args:
        APP_VERSION: ${APP_VERSION:-unknown}
    ports:
      - "8000:5000"
    environment:
      DATABASE_URL: mysql+pymysql://microblog:microblogpassword@dbserver/microblog
    depends_on:
      - dbserver

  dbserver:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: microblog
      MYSQL_USER: microblog
      MYSQL_PASSWORD: microblogpassword
  
  test:
    build:
      context: .
      dockerfile: docker/Dockerfile_test
    volumes:
      - ./app:/home/microblog/app
      - ./tests:/home/microblog/tests