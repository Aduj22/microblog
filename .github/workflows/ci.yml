name: CI

on:
  push:
    branches:
      - '**'
  workflow_call:

jobs:
  test:
    name: Run tests and validate
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          make install-test

      - name: Run tests and Python validation
        run: make test

      - name: Validate Dockerfiles
        run: make validate-docker
